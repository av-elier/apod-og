name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev
      - run: cargo build --release
      - run: cargo test
